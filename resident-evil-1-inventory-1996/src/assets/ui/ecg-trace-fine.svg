<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 30" shape-rendering="crispEdges">
  <!-- One unit is one game pixel of the 48 × 30 ECG screen; the baseline is row 16. -->
  <style>
    svg { animation: sweep 1500ms linear infinite; }
    .erase { animation: erase 1500ms linear infinite; }
    /* The sweep uncovers one whole column at a time. */
    @keyframes sweep {
      0% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(48); }
      55%, 100% { clip-path: inset(0 0 0 0); }
    }
    @keyframes erase {
      0%, 45% { transform: translateX(-144px); }
      100% { transform: translateX(0); }
    }
  </style>
  <defs>
    <linearGradient id="fade">
      <stop offset="0" stop-color="black" />
      <stop offset="66.6667%" stop-color="black" />
      <stop offset="100%" stop-color="white" />
    </linearGradient>
    <mask id="fade-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="30" style="mask-type: luminance">
      <rect width="48" height="30" fill="white" />
      <rect class="erase" width="144" height="30" fill="url(#fade)" />
    </mask>
  </defs>
  <path fill="#00b900" mask="url(#fade-mask)" d="M21 2h1v1h-1z M21 3h2v1h-2z M21 4h2v1h-2z M21 5h2v1h-2z M21 6h2v1h-2z M21 7h1v1h-1z M23 7h1v1h-1z M20 8h1v1h-1z M23 8h1v1h-1z M20 9h1v1h-1z M23 9h1v1h-1z M20 10h1v1h-1z M23 10h2v1h-2z M20 11h1v1h-1z M24 11h1v1h-1z M30 11h1v1h-1z M19 12h2v1h-2z M24 12h1v1h-1z M29 12h2v1h-2z M19 13h1v1h-1z M24 13h2v1h-2z M29 13h3v1h-3z M19 14h1v1h-1z M24 14h1v1h-1z M29 14h1v1h-1z M31 14h1v1h-1z M19 15h1v1h-1z M25 15h1v1h-1z M28 15h1v1h-1z M32 15h1v1h-1z M0 16h16v1h-16z M18 16h1v1h-1z M25 16h2v1h-2z M28 16h1v1h-1z M32 16h16v1h-16z M16 17h1v1h-1z M18 17h1v1h-1z M25 17h1v1h-1z M27 17h1v1h-1z M17 18h2v1h-2z M25 18h1v1h-1z M27 18h1v1h-1z M17 19h2v1h-2z M26 19h2v1h-2z" />
</svg>
